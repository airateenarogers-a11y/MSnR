[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "msnr-terminal"
version = "0.1.0"
description = "Evidence-driven MSnR research, monitoring and controlled execution"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2,<3", "matplotlib>=3.9,<4", "playwright>=1.50,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]
mt5 = ["MetaTrader5>=5.0; sys_platform == 'win32'"]

[project.scripts]
msnr = "msnr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msnr = ["migrations/*.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
