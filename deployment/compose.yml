services:
  dashboard:
    image: msnr-terminal:local
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["msnr-data:/app/var"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: msnr-terminal:local
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: ../.env
    command: ["msnr", "worker"]
    volumes: ["msnr-data:/app/var"]
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
volumes:
  msnr-data:
