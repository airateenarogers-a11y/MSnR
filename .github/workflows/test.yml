name: verification
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/install.sh
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/pytest --cov=msnr --cov-report=term-missing
      # Real Chrome tests run only when MSNR_CHROME_EXECUTABLE is configured.
      # MT5 integration and broker forwarding require a separate Windows demo host.
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
      - name: Test desktop lifecycle and Windows credential encryption
        shell: pwsh
        run: |
          .venv/Scripts/python -m pytest -q tests/test_desktop.py tests/test_worker_recovery.py tests/test_mt5_feed.py tests/test_strategy_v5.py --junitxml=windows-tests.xml
          if ($LASTEXITCODE -ne 0) {
            $failureCode = $LASTEXITCODE
            if (Test-Path windows-tests.xml) {
              [xml]$results = Get-Content windows-tests.xml -Raw
              foreach ($failure in $results.SelectNodes('//failure|//error')) {
                $detail = $failure.InnerText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error::$detail"
              }
            }
            exit $failureCode
          }
          $env:PSModulePath = ''
          powershell -NoProfile -File deployment/test-windows-bootstrap.ps1
      - name: Verify install, upgrade and restart
        if: github.ref != 'refs/heads/installer-source'
        shell: pwsh
        run: |
          if (Test-Path Install-MSnR.cmd) {
            $env:MSNR_SETUP_TEST = '1'
            $env:MSNR_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'MSnR installer test with spaces'
            & .\Install-MSnR.cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $app = Join-Path $env:MSNR_INSTALL_ROOT 'app'
            $vault = Join-Path $app 'var/desktop/credentials.dpapi'
            $before = (Get-FileHash $vault -Algorithm SHA256).Hash
            $journal = Join-Path $app 'var/desktop/upgrade-sentinel.txt'
            Set-Content $journal 'preserve this runtime record'
            $marker = Join-Path $app '.msnr-source.json'
            $release = Get-Content $marker -Raw | ConvertFrom-Json
            $release.commit = '0' * 40
            $release | ConvertTo-Json | Set-Content $marker
            & .\Install-MSnR.cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash $vault -Algorithm SHA256).Hash -ne $before) { throw 'Upgrade changed encrypted credentials' }
            if ((Get-Content $journal) -ne 'preserve this runtime record') { throw 'Upgrade lost runtime state' }
            if (-not (Test-Path (Join-Path $env:MSNR_INSTALL_ROOT 'backups/app-*'))) { throw 'Upgrade backup missing' }
            & .\Install-MSnR.cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
